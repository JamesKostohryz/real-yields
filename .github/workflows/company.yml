name: company-data

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (leave blank to use the TICKER cell in the Cockpit sheet)"
        required: false
        default: ""
      obs_category:
        description: "Obsolescence durability (A=durable, B=moderate, C=exposed). KEEP means: reuse what run_stamp_<T>.csv already records for this ticker."
        required: false
        type: choice
        default: "KEEP"
        options: ["KEEP", "A", "B", "C"]
      ory_override:
        description: "Obsolescence Risk Year override (optional; blank = use the category default)"
        required: false
        default: ""

permissions:
  contents: write

# ADDED 2026-09-04, after run #45 (SHA 0de5188) and seven others that same day failed the
# same way: two workflow_dispatch runs landing ~20 seconds apart both write
# outputs/erp_overlay_provenance.csv (every company run touches it, not just this ticker's
# own files), the second one's `git pull --rebase` hits a real merge conflict on that shared
# file, and the job dies in detached HEAD with no commit landed. Not a curve-logic defect --
# confirmed by reading the job log (steps 1-8 all succeeded; only the Commit step failed) --
# purely a missing concurrency guard. company_request.yml, this workflow's git-triggered
# twin, already serializes on group "company-data-request" and writes the exact same shared
# file; joining that group here serializes both entry points against each other and against
# themselves, which is what should have been true from the start.
concurrency:
  group: company-data-request
  cancel-in-progress: false

# The Cockpit Google Sheet drives the run: put the ticker in its TICKER cell.
# You keep the TICKER cell but LEAVE THE BOND ROWS EMPTY â€” EODHD now supplies the
# bonds. With no bond rows in the sheet, run_company falls back to the committed
# bonds/<TICKER>.csv, which the "Refresh bonds from EODHD" step regenerates first.
env:
  BONDS_SHEET_ID: "1KnbQFHWFXhZZ7Fy2rB1KplWT3GYblNlIEWDh7BzLOC4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull this issuer's bonds from EODHD and rewrite bonds/<TICKER>.csv.
      # It reads the ticker from the workflow box if given, else the sheet's
      # TICKER cell (same reader run_company uses). Safe no-op on any error.
      - name: Refresh bonds from EODHD
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TICKER: "${{ github.event.inputs.ticker }}"
        run: python refresh_bonds.py

      # KEEP reuses the durability judgment already recorded for this ticker instead of
      # re-deciding it. Added 2026-08-20 so a SCHEDULED refresh is possible at all: re-running
      # a company on the default "B" would silently overwrite an A or a C with no diff to see,
      # and the category lands in coe_v2_<T>_latest_annual.csv, which is the cost-of-equity
      # curve the AEG engine discounts with. A ticker with no recorded category and no explicit
      # choice falls back to B exactly as before -- that is the pre-existing default, made
      # visible rather than changed.
      - name: Resolve the durability category
        id: obs
        env:
          TICKER: "${{ github.event.inputs.ticker }}"
          REQUESTED: "${{ github.event.inputs.obs_category }}"
        run: |
          set -euo pipefail
          T=$(echo "${TICKER}" | tr '[:lower:]' '[:upper:]')
          CAT="${REQUESTED:-KEEP}"
          ORY=""
          if [ "$CAT" = "KEEP" ] || [ -z "$CAT" ]; then
            STAMP="outputs/run_stamp_${T}.csv"
            if [ -f "$STAMP" ]; then
              CAT=$(awk -F, '$1=="obs_category"{print $2}' "$STAMP" | tr -d '\r' | head -1)
              ORY=$(awk -F, '$1=="ory_override"{print $2}' "$STAMP" | tr -d '\r' | head -1)
            fi
            if [ -z "$CAT" ]; then
              CAT="B"
              echo "::notice::${T} has no recorded durability category; using the standing default B. Dispatch this workflow once with A, B or C explicitly to record the judgment."
            else
              echo "::notice::${T} reusing recorded durability category ${CAT}${ORY:+ (ORY ${ORY})}"
            fi
          fi
          echo "cat=$CAT" >> "$GITHUB_OUTPUT"
          echo "ory=$ORY" >> "$GITHUB_OUTPUT"

      - name: Pull company data
        env:
          TICKER: "${{ github.event.inputs.ticker }}"
          OBS_CATEGORY: "${{ steps.obs.outputs.cat }}"
          ORY_OVERRIDE: "${{ github.event.inputs.ory_override != '' && github.event.inputs.ory_override || steps.obs.outputs.ory }}"
        run: python -m asfp.run_company

      # Decision B (ERP 0700): the valuation basis is ERP's forward curve, not the
      # pipeline's own real curve / variance ERP. Re-apply it on top of what the
      # generator just wrote, BEFORE the commit â€” otherwise this job silently
      # reverts the decision (asfp-bot b701da3 did exactly that, leaving the engine
      # discounting at pipeline-rf + ERP-erp). No-op if history/ERP_OVERLAY.json is
      # absent; fails the job loudly rather than committing a wrong rate.
      - name: Apply ERP forward-curve overlay (Decision B)
        run: python apply_erp_overlay.py

      - name: Commit
        run: |
          git config user.name "asfp-bot"
          git config user.email "asfp-bot@users.noreply.github.com"
          git add outputs/ bonds/
          git commit -m "company data update" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push
