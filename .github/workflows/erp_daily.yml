name: erp-daily-close

# The ERP "today" curve is rebuilt each weekday close (James's 2026-07-22 decision):
# build_erp_daily.py (v4 engine) + run_erp_daily.py (writer) publish
#   history/TODAY_forward_curve_latest.csv + history/ERP_effective_latest.csv,
# which the auto-latest overlay (apply_erp_overlay.py) consumes on the next pipeline run.
#
# Turned live 2026-07-23 after ERP eyeballed a GREEN live preview (eff_coe 6.38%, identity exact
# at 4dp, FRED sources confirmed: DFII5/10/20/30 real, DGS1 nominal-1y, SP500 close).
#
# JOBS
#   gate    : ALWAYS runs (schedule + dispatch). Hermetic acceptance gate + writer<->overlay
#             contract test. Fully offline, fail-closed. Publishing depends on it.
#   publish : needs gate. Runs on schedule, or manual dispatch with publish=true. Fetches today's
#             FRED inputs, rebuilds, writes the two _latest files, commits + pushes them.
#             Fail-closed: fetch raises if FRED_API_KEY unset or any series missing, and the whole
#             job is skipped if gate fails.
#
# Manual dispatch inputs: live_preview=true = READ-ONLY fetch preview (no commit);
#                         publish=true      = do a real publish now (for the first confirmed run).

on:
  schedule:
    # every weekday 12:30 UTC (~7:30am Central), 30 min after weekly-real-yields (12:00) to avoid a
    # push race. Rebuilds the ERP curve from the latest published FRED real/nominal + S&P close.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      live_preview:
        description: "READ-ONLY live FRED fetch preview for eyeball (no commit)."
        type: boolean
        default: false
      publish:
        description: "Publish now: fetch + rebuild + commit the two _latest files."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: erp-daily-close
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Smoke — v4 library loads (fail-closed on import/precompute)
        run: python -c "import build_erp_daily as b; print('build_erp_daily import OK; params locked, TMAX=%d' % b.TMAX)"
      - name: Acceptance gate — hermetic self-test (reproduces committed June <1bp, no external files)
        run: python build_erp_daily.py
      - name: Writer <-> overlay contract (runner writes _latest; apply_erp_overlay readers validate identities)
        run: python tests/test_erp_daily_writer.py
      - name: Three-preset publish contract (preset B unchanged; A/C validate and order with the plateau)
        run: python tests/test_erp_daily_presets.py
      - name: Held-state pointer (newest vintage resolves, is fresh, and name matches contents)
        run: python -m pytest tests/test_held_state.py -q
      - name: Live preview (READ-ONLY; no commit)
        if: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.live_preview) }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, tempfile, datetime, importlib.util
          import run_erp_daily as rr
          # WHICH VINTAGE: resolved, never typed. Before 2026-08-18 this line named June
          # literally, so writing a new ERP_HELD_STATE_YYYY-MM.json would have changed
          # nothing and the publish would have gone on using a stale volatility input with
          # every gate green. resolve_held_state() takes the newest vintage, refuses one
          # older than four months, and refuses any file whose name and anchor_vintage
          # disagree. See held_state.py.
          _, state = rr.resolve_held_state(".")
          asof = datetime.date.today().isoformat()
          reals, nom, sp = rr.fetch_daily_inputs(asof)
          d = tempfile.mkdtemp()
          r = rr.run(asof, reals, nominal_1y=nom, sp_close=sp, state=state, outdir=d)
          print("FETCH :", {"asof": asof, "reals": reals, "nominal_1y": nom, "sp_close": sp})
          print("EFFECT: tips=%.3f erp=%.3f coe=%.3f dur=%.2f" % (r["eff_tips"], r["eff_erp"], r["eff_coe"], r["D_out"]))
          spec = importlib.util.spec_from_file_location("ovl", "apply_erp_overlay.py")
          ovl = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(ovl)
          except SystemExit:
              pass
          c = ovl.load_curve(d + "/TODAY_forward_curve_latest.csv")
          e = ovl.load_effective(d + "/ERP_effective_latest.csv")
          print("OVERLAY OK: curve tenors=%d, eff=%s" % (len(c), e))
          print("NOTE: read-only preview; nothing committed.")
          PY

  publish:
    needs: gate
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && fromJSON(inputs.publish)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Rebuild + write the three-preset _latest files (fail-closed on fetch)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json, datetime, importlib.util
          import run_erp_daily as rr
          # WHICH VINTAGE: resolved, never typed. Before 2026-08-18 this line named June
          # literally, so writing a new ERP_HELD_STATE_YYYY-MM.json would have changed
          # nothing and the publish would have gone on using a stale volatility input with
          # every gate green. resolve_held_state() takes the newest vintage, refuses one
          # older than four months, and refuses any file whose name and anchor_vintage
          # disagree. See held_state.py.
          _, state = rr.resolve_held_state(".")
          asof = datetime.date.today().isoformat()
          reals, nom, sp = rr.fetch_daily_inputs(asof)
          # THREE CALLS TO build_asof ON IDENTICAL INPUTS, added 2026-09-04 -- no second
          # implementation. Preset B writes to the same stable names as before (verified
          # byte-identical to plain run() in tests/test_erp_daily_presets.py); A and C are
          # new, additive files that only the SETUP bench reads.
          results = rr.run_all_presets(asof, reals, nominal_1y=nom, sp_close=sp, state=state, outdir="history")
          r = results["B"]
          print("PUBLISH %s: eff tips=%.4f erp=%.4f coe=%.4f dur=%.2f" % (asof, r["eff_tips"], r["eff_erp"], r["eff_coe"], r["D_out"]))
          for preset, rp in results.items():
              print("  preset %s (plateau %.2fpp): eff_erp=%.4f eff_coe=%.4f" % (preset, __import__("build_erp_daily").PLATEAU_PRESETS[preset], rp["eff_erp"], rp["eff_coe"]))
          # fail-closed: validate the just-written files with the overlay's OWN readers before committing
          spec = importlib.util.spec_from_file_location("ovl", "apply_erp_overlay.py")
          ovl = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(ovl)
          except SystemExit:
              pass
          c = ovl.load_curve("history/TODAY_forward_curve_latest.csv")
          e = ovl.load_effective("history/ERP_effective_latest.csv")
          assert len(c) == 30, "forward curve must have 30 tenors"
          print("OVERLAY VALIDATED: curve tenors=%d, eff=%s" % (len(c), e))
          PY

      # ⛔ APPLY THE OVERLAY HERE, added 2026-08-22. Until today this job wrote only the two
      # history/ files and left outputs/ to "the next pipeline run". The weekly job fires at
      # 12:54 UTC and this one at 13:23 -- twenty-nine minutes LATER -- so outputs/ was overlaid
      # with YESTERDAY's curve every single day and nothing said so. Verified 2026-08-22: every
      # tenor of outputs/curve_latest_annual.csv matched the 2026-08-20 history file while the
      # 2026-08-21 file sat published beside it. The valuation engine reads outputs/, so it was
      # discounting on a curve one session old, permanently.
      #
      # Publishing a rate and leaving its consumer on the previous one is not a scheduling detail;
      # it is a stale number wearing a fresh timestamp.
      - name: Apply the overlay so outputs/ carries TODAY's curve, not yesterday's
        run: |
          python apply_erp_overlay.py
          python tests/test_overlay_units.py

      - name: Commit the refreshed outputs
        run: |
          git config user.name  "erp-daily"
          git config user.email "actions@github.com"
          git add outputs/ || true
          if git diff --cached --quiet; then
            echo "outputs already current"
          else
            git commit -m "erp-daily: overlay today's curve onto outputs/ $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      # EARLY WARNING, added 2026-08-19. held_state.py refuses a state older than 4 months and
      # stops publishing. That backstop is correct and is NOT being relaxed -- but it is a wall,
      # not a warning: the June 2026 vintage went unrefreshed for two months and the first
      # symptom would have been the ERP simply stopping on 2026-11-01. This step turns the
      # last stretch before the wall into a red run, roughly two months of notice. It runs AFTER
      # the publish steps, so a stale-but-legal state still publishes; only the silence ends.
      - name: Warn early if the monthly re-anchor is overdue
        run: |
          python - <<'PY'
          import datetime as dt, sys
          from held_state import resolve_held_state, MAX_STATE_AGE_MONTHS
          p, s = resolve_held_state(".")
          y, m = (int(x) for x in s["anchor_vintage"].split("-"))
          t = dt.datetime.now(dt.timezone.utc).date()
          age = (t.year - y) * 12 + (t.month - m)
          vs = s.get("vs")
          shape = ("vs(T) %d-vector" % len(vs)) if isinstance(vs, list) else ("SCALAR vs=%s" % vs)
          print("held state %s, age %d month(s), %s" % (s["anchor_vintage"], age, shape))
          if not isinstance(vs, list):
              print("::error::The held state carries a SCALAR vs, not the approved vs(T) term "
                    "structure. The engine accepts both, so this is silently charging one flat "
                    "volatility number at every tenor. Run erp-monthly-reanchor.")
              sys.exit(1)
          if age >= 2:
              print("::error::The monthly re-anchor is %d months overdue. Publishing STOPS at "
                    "age > %d. Run the erp-monthly-reanchor workflow." % (age, MAX_STATE_AGE_MONTHS))
              sys.exit(1)
          print("re-anchor is current.")
          PY

      - name: Commit + push the three-preset _latest files
        run: |
          git config user.name "asfp-bot"
          git config user.email "asfp-bot@users.noreply.github.com"
          git add history/TODAY_forward_curve_latest.csv history/ERP_effective_latest.csv \
                  history/TODAY_forward_curve_latest_A.csv history/ERP_effective_latest_A.csv \
                  history/TODAY_forward_curve_latest_C.csv history/ERP_effective_latest_C.csv
          git commit -m "erp-daily: publish ERP today curve, presets A/B/C $(date -u +%F)" || { echo "no changes to commit"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push
