name: company-data (git-request)

# Git-triggered twin of company.yml. Lets a workspace that can push over git but cannot reach
# the GitHub REST API run the per-ticker rate/company build (coe_v2 + cod + company files that
# the aeg-valuation onboard step depends on). Fires ONLY when requests/company-data.json changes.
# Additive — company.yml is untouched.
#
# Request file shape: { "ticker": "AZO", "obs_category": "A|B|C", "ory_override": "" }

on:
  push:
    branches: [main]
    paths:
      - "requests/company-data.json"

permissions:
  contents: write

concurrency:
  group: company-data-request
  cancel-in-progress: false

env:
  BONDS_SHEET_ID: "1KnbQFHWFXhZZ7Fy2rB1KplWT3GYblNlIEWDh7BzLOC4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read request
        id: req
        run: |
          T=$(python -c "import json,sys;d=json.load(open('requests/company-data.json'));sys.stdout.write(str(d.get('ticker','')).strip().upper())")
          OBS=$(python -c "import json,sys;d=json.load(open('requests/company-data.json'));v=str(d.get('obs_category','B')).strip().upper();sys.stdout.write(v or 'B')")
          ORY=$(python -c "import json,sys;d=json.load(open('requests/company-data.json'));sys.stdout.write(str(d.get('ory_override','')).strip())")
          if [ -z "$T" ]; then echo "::error::requests/company-data.json has no ticker"; exit 1; fi
          echo "ticker=$T" >> "$GITHUB_OUTPUT"
          echo "obs=$OBS" >> "$GITHUB_OUTPUT"
          echo "ory=$ORY" >> "$GITHUB_OUTPUT"
          echo "ticker=$T obs=$OBS ory=$ORY"
      - name: Refresh bonds from EODHD
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          TICKER: ${{ steps.req.outputs.ticker }}
        run: python refresh_bonds.py
      - name: Pull company data
        env:
          TICKER: ${{ steps.req.outputs.ticker }}
          OBS_CATEGORY: ${{ steps.req.outputs.obs }}
          ORY_OVERRIDE: ${{ steps.req.outputs.ory }}
        run: python -m asfp.run_company
      - name: Apply ERP forward-curve overlay (Decision B)
        run: python apply_erp_overlay.py
      - name: Commit
        run: |
          git config user.name "asfp-bot"
          git config user.email "asfp-bot@users.noreply.github.com"
          git add outputs/ bonds/
          git commit -m "company data (git-request): ${{ steps.req.outputs.ticker }}" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push
